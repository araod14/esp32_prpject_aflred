# Bloque nginx para esp32.tudominio.com
# 1) Copia a /etc/nginx/sites-available/esp32 y enlaza a sites-enabled/
# 2) Ajusta server_name y el puerto (proxy_pass) si cambiaste PORT
# 3) Ejecuta certbot para el TLS:  certbot --nginx -d esp32.tudominio.com
#    (certbot reescribe este archivo para añadir el bloque 443 + redirección)

server {
    listen 80;
    listen [::]:80;
    server_name esp32.tudominio.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Cuerpo pequeño: la telemetría del ESP32 es JSON minúsculo
    client_max_body_size 32k;
}
